# ============================================================
# AlumniConnect - Spring Boot Application Configuration
# ============================================================

# --- Server Port ---
# Backend will run on dynamic $PORT in cloud (e.g. Render) or 8080 locally
server.port=${PORT:8080}

# --- MySQL Database Configuration ---
# Supports environment variables for cloud databases (TiDB Cloud, Aiven, Railway, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/alumniconnect?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Configuration ---
# hibernate.ddl-auto=update : Hibernate creates/updates tables automatically
# This is perfect for development - no need to write CREATE TABLE SQL manually
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Application Name ---
spring.application.name=AlumniConnect

# --- Logging Level ---
logging.level.org.springframework=INFO
logging.level.com.alumniconnect=DEBUG
